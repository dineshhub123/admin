<div class="store-list-container">
  <!-- Header with title and add button -->
  <div class="header">
    <h1>Store Management</h1>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon> Add Store
    </button>
  </div>

  <!-- Search filter -->
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search Stores</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filter stores...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- Loading spinner -->
  <mat-spinner *ngIf="isLoading" diameter="100" class="loading-spinner"></mat-spinner>

  <!-- Debug data (temporary) -->
  <!-- <pre *ngIf="dataSource.data">{{ dataSource.data | json }}</pre> -->

  <!-- Stores table -->
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort *ngIf="dataSource.data.length > 0">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header  style="background-color: #062d51; color: white;"> Name </th>
        <td mat-cell *matCellDef="let store"> {{store.name}} </td>
      </ng-container>

      <!-- Address Column -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef mat-sort-header  style="background-color: #062d51; color: white;"> Address </th>
        <td mat-cell *matCellDef="let store"> {{store.address}} </td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef mat-sort-header  style="background-color: #062d51; color: white;"> Phone </th>
        <td mat-cell *matCellDef="let store"> {{store.phone}} </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header  style="background-color: #062d51; color: white;"> Email </th>
        <td mat-cell *matCellDef="let store"> {{store.email}} </td>
      </ng-container>

      <!-- Combined Actions Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef  style="background-color: #062d51; color: white;"> Actions </th>
        <td mat-cell *matCellDef="let store">
          <button mat-icon-button color="primary" (click)="openEditDialog(store)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
            <button mat-icon-button color="warn" (click)="deleteStore(store.id)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

        

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && !dataSource.data?.length" class="no-stores">
    <mat-icon>store</mat-icon>
    <p>No stores found</p>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      Add Your First Store
    </button>
  </div>
</div>
