<div class="store-list-container">
  <!-- Header with title and add button -->
  <div class="header">
    <h1>Store Management</h1>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon> Add Store
    </button>
  </div>

  <!-- Search filter -->
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search Stores</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filter stores...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- Loading spinner -->
  <mat-spinner *ngIf="isLoading" diameter="50" class="loading-spinner"></mat-spinner>

  <!-- Stores table -->
  <div class="table-container" *ngIf="!isLoading">
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let store"> {{store.name}} </td>
      </ng-container>

      <!-- Address Column -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Address </th>
        <td mat-cell *matCellDef="let store"> {{store.address}} </td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Phone </th>
        <td mat-cell *matCellDef="let store"> {{store.phone}} </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
        <td mat-cell *matCellDef="let store"> {{store.email}} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let store">
          <button mat-icon-button color="primary" (click)="openEditDialog(store)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          
        </td>
      </ng-container>

<!-- Actions Column -->
      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let store">
          <button mat-icon-button color="warn" (click)="deleteStore(store.id)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  </div>

  <!-- Empty state -->
  <div class="empty-state" *ngIf="!isLoading && dataSource.data.length === 0">
    <mat-icon>storefront</mat-icon>
    <h3>No stores found</h3>
    <p>Add your first store by clicking the "Add Store" button</p>
  </div>
</div>
