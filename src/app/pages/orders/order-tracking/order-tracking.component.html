<!-- order-tracking.component.html - Horizontal Timeline -->
<div class="order-tracking-container">
  
  <!-- Header Section -->
  <div class="tracking-header">
    <div class="order-info">
      <h1 class="order-title">ORDER #{{ orderId }}</h1>
      <div class="delivery-info">
        <div class="expected-arrival">
          <span class="label">Expected Arrival</span>
          <span class="date">{{ expectedArrival }}</span>
        </div>
        <div class="carrier-info">
          <span class="carrier">{{ carrier }}</span>
          <span class="tracking-number" (click)="copyTrackingNumber()">
            {{ trackingNumber }}
            <mat-icon class="copy-icon">content_copy</mat-icon>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Horizontal Tracking Timeline -->
  <div class="tracking-timeline">
    <h3 class="timeline-title">Tracking History</h3>
    
    <div class="timeline-horizontal">
      <!-- Main Timeline Line -->
      <div class="timeline-line"></div>
      
      <!-- Timeline Events -->
      <div *ngFor="let event of trackingEvents; let i = index" 
           class="timeline-event"
           [class.current]="event.isCurrent"
           [class.completed]="!event.isCurrent && i < currentIndex"
           [class.pending]="!event.isCurrent && i > currentIndex"
           [class.status-{{event.status}}]="true">
        
        <!-- Timeline Dot -->
        <div class="timeline-dot" [class]="'status-' + event.status">
          <mat-icon class="event-icon">{{ getStatusIcon(event.status) }}</mat-icon>
        </div>
        
        <!-- Event Content -->
        <div class="event-content">
          <span class="event-status" [class]="'status-' + event.status">
            {{ event.description }}
          </span>
          <span class="event-time">{{ event.time }}</span>
          <span class="event-date">{{ event.date }}</span>
          <span class="event-location">{{ event.location }}</span>
        </div>
      </div>
    </div>
  </div>
