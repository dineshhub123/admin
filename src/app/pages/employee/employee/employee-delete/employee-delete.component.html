 <h2 mat-dialog-title>Confirm Delete</h2>

    <mat-dialog-content>
      Are you sure you want to delete this employee?
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button (click)="close()">Cancel</button>
      <button
        mat-raised-button
        color="warn"
        (click)="deleteEmployee()"
        [disabled]="loading">
        {{ loading ? 'Deleting...' : 'Delete' }}
      </button>
    </mat-dialog-actions>
