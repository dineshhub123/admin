<mat-card class="mat-elevation-z4 order-container">
<div class="header-align">
  <div class="header-left">
    <div class="order-heading mb-3">Employee List</div>
  </div>

  <div class="header-right">
    <button mat-raised-button color="primary"  routerLink="/employee/add">
      <mat-icon>group</mat-icon> Employee
    </button>
  </div>
</div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 full-width">

    <!-- Employee ID -->
    <ng-container matColumnDef="employee_id">
      <th mat-header-cell *matHeaderCellDef> Emp ID </th>
      <td mat-cell *matCellDef="let row"> {{ row.employee_id }} </td>
    </ng-container>

    <!-- Name -->
    <ng-container matColumnDef="full_name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let row"> {{ row.full_name }} </td>
    </ng-container>

    <!-- Mobile -->
    <ng-container matColumnDef="mobile">
      <th mat-header-cell *matHeaderCellDef> Mobile </th>
      <td mat-cell *matCellDef="let row"> {{ row.mobile }} </td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let row"> {{ row.email }} </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef class="text-center">
    Actions
  </th>

  <td mat-cell *matCellDef="let row">
    <div class="action-icons">
      <button mat-icon-button color="primary" (click)="viewEmployee(row)">
        <mat-icon>visibility</mat-icon>
      </button>

      <button mat-icon-button color="accent" (click)="editEmployee(row)">
        <mat-icon>edit</mat-icon>
      </button>

      <button mat-icon-button color="warn" (click)="openDeleteDialog(row)">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </td>
</ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons>
  </mat-paginator>

</mat-card>
