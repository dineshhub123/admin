<section class="vh-100 d-flex align-items-center justify-content-center mb-4">
   <mat-card class="mat-elevation-z4 signup-section">
      <div class="container">
         <div class="row justify-content-center">
            <div class="col-md-12">
               <form [formGroup]="adminSignupForm" (ngSubmit)="adminSignup()">
                  <h1 class="mat-headline">Super Admin Sign Up</h1>
                  <p class="mb-3">Sign into your account</p>
                  <div class="row justify-content-center">
                     <!-- First Name -->
                     <div class="col-md-12 mb-2">
                        <mat-form-field appearance="outline" class="w-100">
                           <mat-label>First Name</mat-label>
                           <input matInput formControlName="firstname" placeholder="First Name">
                           <mat-error class="matError" *ngIf="f['firstname'].touched && f['firstname'].invalid">
                              First name is required (min 3 characters)
                           </mat-error>
                        </mat-form-field>
                     </div>
                     <!-- Last Name -->
                     <div class="col-md-12 mb-2">
                        <mat-form-field appearance="outline" class="w-100">
                           <mat-label>Last Name</mat-label>
                           <input matInput formControlName="lastname" placeholder="Last Name">
                           <mat-error class="matError" *ngIf="f['lastname'].touched && f['lastname'].invalid">
                              Last name is required (min 3 characters)
                           </mat-error>
                        </mat-form-field>
                     </div>
                     <!-- Email -->
                     <div class="col-md-12 mb-2">
                        <mat-form-field appearance="outline" class="w-100">
                           <mat-label>Email</mat-label>
                           <input matInput type="email" formControlName="email" placeholder="Email">
                           <mat-error class="matError" *ngIf="f['email'].touched && f['email'].invalid">
                              Please enter a valid email address
                           </mat-error>
                        </mat-form-field>
                     </div>
                     <!-- Phone -->
                     <div class="col-md-12 mb-2">
                        <mat-form-field appearance="outline" class="w-100">
                           <mat-label>Phone</mat-label>
                           <input matInput type="tel" formControlName="phone" placeholder="Mobile">
                           <mat-error class="matError" *ngIf="f['phone'].touched && f['phone'].invalid">
                              Enter a valid 10-digit phone number
                           </mat-error>
                        </mat-form-field>
                     </div>
                     <!-- Password -->
                     <div class="col-md-12 mb-2">
                        <mat-form-field appearance="outline" class="w-100">
                           <mat-label>Password</mat-label>
                           <input matInput type="password" formControlName="password" placeholder="Password">
                           <mat-error class="matError" *ngIf="f['password'].touched && f['password'].invalid">
                              Password must be minimum 6 characters
                           </mat-error>
                        </mat-form-field>
                     </div>
                     <div class="text-right mt-2" style="text-align: right;">
                        <button mat-raised-button color="primary" type="submit">
                           Register
                        </button>
                     </div>
                  </div>
               </form>
            </div>
         </div>
      </div>
   </mat-card>
</section>
