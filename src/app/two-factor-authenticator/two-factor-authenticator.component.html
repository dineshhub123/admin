<div class="otp-container">
    <mat-card class="mat-elevation-z4 card-container">
        <form [formGroup]="twoFaForm">
            <div class="otp-card">
                <div class="lock-icon">
                    🔒 
                    <!-- <mat-icon>lock</mat-icon> -->
                </div>
                <h2>OTP Verification</h2>
                <p class="subtitle">
                    Open your Google Authenticator app and enter the 6-digit code to continue.
                </p>
                <div class="otp-section">
                    <label>Enter OTP</label>
                    <div class="otp-inputs">
                        <input *ngFor="let box of otpArray; let i = index" #otpInput type="text" maxlength="1" [ngModelOptions]="{standalone: true}"
                            [(ngModel)]="otp[i]" (input)="onInput($event, i)" (keydown)="onKeyDown($event, i)" />
                    </div>
                    <mat-error *ngIf="twoFaForm.get('otp')?.invalid && twoFaForm.get('otp')?.touched"> OTP is
                        Required!</mat-error>
                </div>
                <div class="info-text">
                    Use the 6-digit code from your Google Authenticator app.
                </div>
                <button class="verify-btn" mat-raised-button color="primary" (click)="verifyOtp()"
                    [disabled]="!isOtpValid">
                    Verify OTP
                </button>
            </div>
        </form>
    </mat-card>
</div>
