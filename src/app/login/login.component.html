<section class="">
   <mat-card class="mat-elevation-z4 login-section">
      <form [formGroup]="loginForm" (ngSubmit)="login(loginForm.value)">
         <h2 class="mat-headline">Login</h2>
         <p class="mb-3">Sign into your account</p>
         <mat-form-field appearance="outline" class="w-100 mb-3">
            <mat-label>Mobile/Email</mat-label>
            <input matInput type="text" formControlName="mobile" placeholder="Mobile/Email">
            <mat-error>Mobile or email is Required!</mat-error>
         </mat-form-field>
         <mat-form-field appearance="outline" class="w-100 mb-3">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Password">
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
               <mat-icon>
                  {{ hidePassword ? 'visibility_off' : 'visibility' }}
               </mat-icon>
            </button>
            <mat-error>Password is Required!</mat-error>
         </mat-form-field>
         
         <div class="login-submit mb-4">
            <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
               Login
            </button>
         </div>
         <!-- <div class="text-muted small" style="text-align: left;">
            <a href="#" class="admin-login">Forgot password?</a><br />
            <span class="admin-login">Don't have an account? <a class="signlink" (click)="signup()">Register here</a></span><br />
             <a class="signlink" (click)="twoAuthenticator()">2FA Authenticator</a>&nbsp;
            <a class="signlink" (click)="changepass()">Change Password</a>
         </div>  -->

      </form>
   </mat-card>
</section>
